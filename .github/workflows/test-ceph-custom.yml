name: Test Ceph CobaltCore Unit Tests

on:
  workflow_dispatch:
    inputs:
      base_branch:
        description: 'Base branch to test (e.g. squid-19.2.4-cobaltcore-storage)'
        required: true
        type: string
  pull_request:
    branches:
      - 'squid-*-cobaltcore-storage'

jobs:
  test-ceph:
    name: Run Ceph Unit Tests
    runs-on: self-hosted
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read

    steps:
      # --- 1. CHECKOUT & PREPARE ---
      - name: Determine ref
        id: ref
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_BRANCH: ${{ inputs.base_branch }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            printf 'ref=%s\n' "$PR_HEAD_SHA" >> "$GITHUB_OUTPUT"
          else
            printf 'ref=%s\n' "$BASE_BRANCH" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout CobaltCore Ceph
        uses: actions/checkout@v4
        with:
          repository: cobaltcore-dev/ceph
          ref: ${{ steps.ref.outputs.ref }}
          submodules: recursive
          fetch-depth: 0

      - name: Clean Workspace
        run: |
          echo "Cleaning workspace..."
          git clean -fdx
          git submodule foreach --recursive git clean -fdx
          git submodule update --init --recursive

          # build-with-container.py always runs `podman run --name=ceph_build` (hard-coded).
          # A container left behind by a killed job (run 34588947862, 2026-09-14) blocked
          # every later run with "container name ceph_build is already in use".
          if podman container exists ceph_build; then
            echo "::warning::removing leftover ceph_build container"
            podman inspect ceph_build --format 'status={{.State.Status}} started={{.State.StartedAt}} finished={{.State.FinishedAt}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}}' || true
            podman rm -f ceph_build
          fi

      # --- 2. COMPUTE PARALLELISM ---
      - name: Compute build + test parallelism
        run: |
          CORE_COUNT=$(nproc)
          MEM_GB=$(free -g | awk '/^Mem:/{print $2}')

          # Build (ninja): bounded by RAM/2 — linker is the heavy step
          JOBS=$((MEM_GB / 2))
          [[ $JOBS -lt 2 ]] && JOBS=2
          [[ $JOBS -gt $CORE_COUNT ]] && JOBS=$CORE_COUNT
          echo "NINJAJOBS=$JOBS" >> "$GITHUB_ENV"

          # ctest: bounded by RAM/4 (tests spin up ceph daemons, ~2-4 GB each)
          # and nproc/2 (upstream's get_processors() default), capped at 32.
          CPU_HALF=$((CORE_COUNT / 2))
          MEM_QUARTER=$((MEM_GB / 4))
          CTP=$CPU_HALF
          [[ $MEM_QUARTER -lt $CTP ]] && CTP=$MEM_QUARTER
          [[ $CTP -gt 32 ]] && CTP=32
          [[ $CTP -lt 2 ]] && CTP=2
          echo "CTEST_PARALLEL=$CTP" >> "$GITHUB_ENV"

      # --- 3. BUILD CONTAINER IMAGE (with upstream's prebuilt Boost) ---
      # build-with-container.py's own "build-container" step runs `podman build --pull`
      # (pull policy "always"): every refresh of the floating ubuntu:22.04 tag rebuilds
      # the image and re-runs install-deps.sh, which fetches the prebuilt ceph-libboost
      # packages via shaman.ceph.com. shaman's libboost index is gone (HTTP 504 / empty)
      # and install-deps.sh silently swallows that, so the image ends up without
      # /opt/ceph and cmake falls back to building Boost from source (2026-09-11).
      # Therefore the image is built here instead: a jammy base pinned by digest with
      # ceph-libboost 1.82 pre-installed from chacra (install-deps.sh then sees
      # installed_ver=1.82 and never contacts shaman), Dockerfile.build on top of it
      # without --pull, and a hard check that the prebuilt Boost is really there.
      - name: Build container image
        env:
          # docker.io/library/ubuntu:22.04 multi-arch index as of 2026-09-03; bump deliberately.
          UBUNTU_DIGEST: sha256:b8b6ee6aa931ecd9d0d952abc34dc0e5f7c6a30c6bb71b079fe399fde0329c02
          # The chacra repo that shaman resolved for install-deps.sh (same sha1 as in install-deps.sh).
          CHACRA_LIBBOOST: https://chacra.ceph.com/r/libboost/master/2804368f5b807ba8334b0ccfeb8af191edeb996f/ubuntu/jammy/flavors/default
          IMAGE_TAG: cobaltcore
        run: |
          podman build -t localhost/ceph-base:jammy-boost1.82 -f - . <<EOF
          FROM docker.io/library/ubuntu@${UBUNTU_DIGEST}
          RUN apt-get update && apt-get install -y --no-install-recommends ca-certificates \
           && echo "deb [trusted=yes] ${CHACRA_LIBBOOST} jammy main" > /etc/apt/sources.list.d/libboost.list \
           && apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --allow-unauthenticated \
                ceph-libboost-atomic1.82-dev ceph-libboost-chrono1.82-dev ceph-libboost-container1.82-dev \
                ceph-libboost-context1.82-dev ceph-libboost-coroutine1.82-dev ceph-libboost-date-time1.82-dev \
                ceph-libboost-filesystem1.82-dev ceph-libboost-iostreams1.82-dev ceph-libboost-locale1.82-dev \
                ceph-libboost-program-options1.82-dev ceph-libboost-python1.82-dev ceph-libboost-random1.82-dev \
                ceph-libboost-regex1.82-dev ceph-libboost-system1.82-dev ceph-libboost-test1.82-dev \
                ceph-libboost-thread1.82-dev ceph-libboost-timer1.82-dev \
           && test -f /opt/ceph/include/boost/config.hpp \
           && rm -rf /var/lib/apt/lists/*
          EOF

          # No --pull here: the locally built base must be accepted as-is.
          podman build -t "ceph-build:${IMAGE_TAG}" \
            --build-arg=DISTRO=localhost/ceph-base:jammy-boost1.82 \
            --build-arg=CEPH_BASE_BRANCH=main \
            -f Dockerfile.build .

          # Never continue with a degraded image.
          podman run --rm "ceph-build:${IMAGE_TAG}" test -f /opt/ceph/include/boost/config.hpp
          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_ENV"

      # --- 4. CONFIGURE + COMPILE TESTS ---
      # -I cache: use the image built above; never pull or rebuild it here.
      - name: Configure and compile tests
        run: |
          ./src/script/build-with-container.py -d jammy --tag "$IMAGE_TAG" -I cache \
            -e configure -e buildtests

      # --- 5. RUN UNIT TESTS ---
      - name: Run ctest
        run: |
          ./src/script/build-with-container.py -d jammy --tag "$IMAGE_TAG" -I cache -e custom -- \
            "cd build && ctest --parallel $CTEST_PARALLEL --test-load $NINJAJOBS --output-junit Testing/junit.xml --output-on-failure --no-compress-output --test-output-size-failed 1024000 -T Test"

      # --- 6. PUBLISH RESULTS ---
      - name: Upload CTest results directory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-testing-dir
          path: build/Testing/
          if-no-files-found: warn

      - name: Upload JUnit XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-xml
          path: build/Testing/junit.xml
          if-no-files-found: warn
