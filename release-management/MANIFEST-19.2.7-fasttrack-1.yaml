- id: 01a14417-d161-7221-87ad-c32f7e8170ec
  title: Keystone Project RO/Viewer role + Implicit Deny
  component: rgw
  category: feature
  provenance:
    type: upstream_pr
    upstream_prs:
    - https://github.com/ceph/ceph/pull/70372
    upstream_pr_state: approved-open
    upstream_commits:
    - c04bf078c2a9f4b11fe978a655c86d5efb4ba230
    previous_backport: 01a0d759-c470-741d-8768-e3924fdfb44e
  justification:
    type: customer
    refs:
    - cobaltcore-dev/cloud-storage#616
    - cobaltcore-dev/cloud-storage#468
    - cobaltcore-dev/cloud-storage#511
    public_summary: 'This feature introduces two new config options: `rgw_keystone_accepted_project_reader_roles`
      and `rgw_keystone_implicit_deny_roles`.


      - `rgw_keystone_accepted_project_reader_roles`:  A reader role, but can be granted more permissions
      by using bucket policy and condition keys, keystone:userid and keystone:role.

      - `rgw_keystone_implicit_deny_roles`: No permissions by default, but authenticated by keystone.
      Similar to reader role above, more permission can be granted using bucket policy and conditions,
      keystone:userid and keystone:role'
  risk:
    blast: availability
    conflict: trivial
    coverage: strong
    upstream: approved-open
    total: 7
    band: medium
  risk_notes: "**blast: availability** — the two new roles are off by default, so nothing\nchanges for\
    \ existing users until an operator configures them. The reason this\nis not rated cosmetic is that\
    \ the change reworks how permissions are worked out\nfor *every* Keystone user, not only for users\
    \ of the new roles. If that went\nwrong, people could lose access they should have. That is recoverable\
    \ and no\ndata is at risk, which is why it is availability rather than data-loss.\n\n**conflict: substantive**\
    \ — the upstream changes did not apply cleanly to this\nrelease. Upstream has since gained several\
    \ Keystone and S3 features that are\nnot in squid, and the patches were written on top of them. Five\
    \ conflicts had\nto be resolved by hand, each time keeping only the parts belonging to this\nfeature\
    \ and leaving the unrelated newer features out. This is the kind of\nchange where the downstream result\
    \ deserves review in its own right, not just a\ncheck that it matches upstream.\n\n**coverage: strong**\
    \ — 88 checks in total, none failing: some against the\ncode on its own, the rest against a running\
    \ gateway talking to a real Keystone\nserver. What was checked:\n\n- A user with only a reader role\
    \ can read, and cannot write. Every storage\n  operation a client can make was tried, one by one,\
    \ including bucket settings\n  and notifications: reads succeeded, writes were refused.\n- A user\
    \ with only an implicit-deny role can do nothing at all, not even list\n  the buckets in its own project.\n\
    - A user holding a normal role such as `member`, or `admin`, still has full\n  control. Nothing changes\
    \ for existing users.\n- A bucket policy naming a capped user can give it access it would not\n  otherwise\
    \ have, including write access for a reader. This was checked with a\n  policy naming the user directly\
    \ and with a policy naming their role.\n- That extra access is limited to what the policy says: another\
    \ user is still\n  refused, the same user is still refused on a different bucket, and removing\n \
    \ the policy puts the restriction back.\n- The Keystone condition keys added by the earlier backport\
    \ still work.\n\nFour of the upstream tests could not be carried over, because they rely on\ninternals\
    \ that this release does not have. What they checked is covered by the\nchecks above against the running\
    \ gateway. Restoring them would mean backporting\na further upstream change unrelated to this feature;\
    \ a note in the test file\nrecords which one.\n\n**Taken ahead of upstream.** The upstream change\
    \ is approved but not yet\nmerged. If it is revised before it lands, this backport and the final upstream\n\
    version could differ, and the next upstream sync may need rework."
  behavior_change: "Two new configuration options, both defaulting to empty, so nothing changes\nuntil\
    \ an operator sets them.\n\n- `rgw keystone accepted project reader roles` — a role listed here admits\
    \ the\n  user on its own and caps it to `RGW_PERM_READ | RGW_PERM_READ_ACP` within its\n  own Keystone\
    \ project. Reads and configuration inspection are allowed; writes\n  are refused.\n- `rgw keystone\
    \ implicit deny roles` — a role listed here admits the user with\n  no implicit permissions at all.\
    \ Such a user cannot even list its project's\n  buckets without an explicit policy grant.\n\nFor both\
    \ tiers the most permissive accepted role wins, so a user that also\nholds `admin` or a plain accepted\
    \ role such as `member` receives full control.\nBoth caps are a floor, not a ceiling: a bucket policy\
    \ naming the user by\n`keystone:userid` or `keystone:role` grants access for that bucket only.\n\n\
    Refused up front for a capped identity regardless of policy: bucket creation,\nSwift account-metadata\
    \ writes, and STS `AssumeRole` (which would replace the\nidentity with a role identity carrying no\
    \ permission mask, discarding the cap).\n\nThe caps do not apply to the librgw/NFS-Ganesha frontend,\
    \ to Keystone users\nassociated with an RGW account (governed entirely by IAM policy), or to\n`radosgw-admin`\
    \ and the admin REST API."
  upgrade_notes: "No migration and no action required on upgrade. Both options default to empty\nand the\
    \ behaviour of existing Keystone users is unchanged.\n\nTo adopt the feature, add the Keystone role\
    \ name to the relevant option:\n\n    rgw keystone accepted roles = member\n    rgw keystone accepted\
    \ project reader roles = objectstore_viewer\n\nAssign a user *only* the reader role to keep it read-only;\
    \ any additional\naccepted role restores full control. Setting `rgw keystone implicit tenants =\n\
    true` is recommended, as the documentation notes."
