  justification:
    type: customer
    refs:
    - cobaltcore-dev/cloud-storage#617
    - cobaltcore-dev/cloud-storage#125
    public_summary: 'Adds a secure in-memory cache for SSE-KMS encryption keys retrieved from Barbican
      (or other KMS backends), eliminating redundant round-trips on repeated access to the same encrypted
      objects. Uses a new SIEVE-based eviction cache (WebCache) and stores decrypted secrets in the Linux
      kernel keyring.

      Please refer to the Ceph documentation on how to configure this feature.'
  risk:
    blast: data-loss
    conflict: substantive
    coverage: partial
    upstream: merged-main
    total: 9
    band: medium
  risk_notes: "- TTLs mean that a deleted or rotated Barbican key won't be immediately reflected.\n- New\
    \ async primitives (async::call_once) and the WebCache are\n  significant new library code shipping\
    \ for the first time.\n- Cache size tuning and system wide keyring quota adjustment needed\n  for\
    \ production workloads (refer to the docs)."
  behavior_change: 'Repeated SSE-KMS access no longer hits the KMS backend on every

    request; decrypted secrets are cached in-memory and in the Linux

    kernel keyring. KMS-cache is ON out of the box.'
  upgrade_notes: 'Feature flag: rgw_crypt_s3_kms_cache_enabled. Set false to disable

    caching entirely and revert to per-request KMS lookups.'
  derived:
