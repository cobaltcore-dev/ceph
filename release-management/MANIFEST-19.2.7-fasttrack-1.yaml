- id: 01a16e5e-c411-772f-92ec-4f24f4a67533
  title: upgrade nvmeof container image version to fix gateway startup
  component: other
  category: fix
  provenance:
    type: other
    other: 'Downstream image bump, no upstream PR. ceph-nvmeof published 1.4.29 on 2026-10-22 (https://github.com/ceph/ceph-nvmeof/releases/tag/1.4.29),
      the first squid-line gateway image built on a ceph that knows aes256k: https://github.com/ceph/ceph-nvmeof/pull/2230
      moved CEPH_VERSION in .env from 19.2.6 to 19.2.7, and that one variable also drives the librados
      built into the image. Requested in ceph/ceph-nvmeof#2203. Upstream ceph still has no PR moving squid''s
      DEFAULT_NVMEOF_IMAGE off 1.2.5.'
    previous_backport: 01a15d41-e5b1-7d20-b6e3-e9ebcec19b81
    upstream_trackers:
    - https://tracker.ceph.com/issues/81778
  justification:
    type: engineering
    refs:
    - cobaltcore-dev/cloud-storage#625
    - https://tracker.ceph.com/issues/81778
    public_summary: 'Since 19.2.6, cephadm creates daemon cephx keys with the `aes256k` key type.

      The NVMe-oF gateway image shipped as the default, `quay.io/ceph/nvmeof:1.2.5`,

      bundles a librados built from ceph 19.0.0, from before `aes256k` existed, so

      the gateway cannot authenticate with the key cephadm gives it. It fails to

      connect to the cluster and restarts, and the nvmeof service never reaches its

      target count.


      `quay.io/ceph/nvmeof:1.4.29` is built on ceph 19.2.7 and uses that key without

      help, so the gateway works with the keys cephadm already creates.


      The upgrade was needed to validate this release: with 1.2.5 the nvmeof

      gateway never starts, so the teuthology jobs that deploy an nvmeof service

      cannot bring the test environment up. With 1.4.29 those jobs deploy and pass.
      '
  risk:
    blast: availability
    conflict: substantive
    coverage: partial
    upstream: downstream-only
    total: 10
    band: high
  risk_notes: "- **blast: availability**: the change is the value of `DEFAULT_NVMEOF_IMAGE`\n  plus the\
    \ revert of the previous backport, which removes cephadm's\n  nvmeof-specific key handling and leaves\
    \ those files identical to upstream\n  squid. A wrong image means gateways do not start, which is\
    \ the failure this\n  fixes. No data path is touched and no on-disk format changes, so nothing can\n\
    \  be silently corrupted. Clusters with no nvmeof service are unaffected.\n- **conflict: substantive**:\
    \ fully custom downstream change, not a cherry-pick,\n  so it carries no upstream review (rubric:\
    \ \"... OR fully custom\"). The diff is\n  the revert of the previous backport plus three constants\
    \ and a template\n  comment, and will carry forward mechanically until upstream squid bumps its\n\
    \  own default.\n- **coverage: partial**: integration coverage only, no unit test for an image\n \
    \ constant. `smoke-roleless` exercises gateway startup with the shipped image\n  on centos and ubuntu.\
    \ Not covered: end-to-end I/O on the shipped image,\n  because `qa/suites/rbd/nvmeof` pins `version:\
    \ latest` and therefore tests a\n  main-line gateway rather than this one.\n- 1.2.5 to 1.4.29 is a\
    \ two-minor-version jump in the gateway itself, not only\n  a librados rebuild, so gateway behaviour\
    \ beyond startup rests on upstream's\n  testing of the 1.4 line. Checked ahead of the jump: the rendered\n\
    \  `ceph-nvmeof.conf` keeps the same six sections and every setting 1.4.29 reads\n  without a default\
    \ is emitted by the template. The gRPC surface is additive\n  (25 RPCs to 32, none removed). And the\
    \ container surface squid's cephadm\n  provides is what 1.4.x expects, with every addition in tentacle's\
    \ version\n  gated on config-json keys squid never sets. Under 1.4.x the presence of\n  `bdevs_per_cluster`\
    \ in the gateway config is what selects how the gateway\n  groups its RADOS connections, not just\
    \ how many, so the line can no longer\n  be removed as a redundant tunable. The template now carries\
    \ a comment saying\n  so."
  behavior_change: 'The default NVMe-oF gateway image moves from `quay.io/ceph/nvmeof:1.2.5` to

    `quay.io/ceph/nvmeof:1.4.29`, in the mgr module, in the cephadm binary

    constants (which still named 1.2.1) and in the example listing in the

    monitoring docs. Clusters that pin `mgr/cephadm/container_image_nvmeof` keep

    their pinned image. If that image predates `aes256k` they stay broken until

    they move the pin.'
  upgrade_notes: 'Clusters without an NVMe-oF service: nothing to do.


    An nvmeof service already stuck from a 19.2.6 or later deploy does not pick up

    the new image on its own. Redeploy it once after the upgrade:


    ```

    ceph orch redeploy nvmeof.<service>

    ```


    The gateway is recreated from 1.4.29 and starts with the key it already has.

    No cephx surgery is needed.'
